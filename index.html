<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>同學端 - 課堂問答大賽</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- MQTT.js (連線橋樑) -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Noto Sans TC', sans-serif; touch-action: manipulation; }
        .font-fredoka { font-family: 'Fredoka', cursive; }
        @media screen and (orientation: portrait) and (max-width: 1024px) {
            #portraitNotice { display: flex !important; }
        }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.4); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #f472b6; border-radius: 10px; }
        .pop-card { box-shadow: 0 8px 0px rgba(244, 114, 182, 0.2), 0 15px 25px -5px rgba(0, 0, 0, 0.05); }
        .pop-btn { box-shadow: 0 5px 0px rgba(0, 0, 0, 0.12); }
        .pop-btn:active { transform: translateY(3px); box-shadow: 0 2px 0px rgba(0, 0, 0, 0.12); }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-100 via-purple-100 to-sky-100 text-slate-800 h-screen w-screen overflow-hidden flex flex-col relative font-sans">

    <!-- 豎屏旋轉提醒 -->
    <div id="portraitNotice" class="fixed inset-0 bg-pink-900/95 text-white z-50 hidden flex-col items-center justify-center p-6 text-center backdrop-blur-md">
        <div class="animate-bounce mb-6 text-amber-300 text-7xl">📱✨</div>
        <h2 class="text-3xl font-black mb-2 text-amber-300">請把平板轉橫過來喔！ 🔄</h2>
        <p class="text-pink-100 text-base max-w-sm font-bold">轉至橫屏模式答題更方便！</p>
    </div>

    <!-- 頂部導航列 -->
    <header class="bg-white/95 backdrop-blur-md border-b-4 border-pink-300 shadow-md py-2.5 px-6 flex justify-between items-center z-20 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="bg-gradient-to-tr from-pink-400 to-rose-400 text-white p-2.5 rounded-2xl shadow-md">
                <i class="fa-solid fa-pen-to-square text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl md:text-2xl font-black text-slate-800 font-fredoka flex items-center gap-2">
                    <span class="bg-gradient-to-r from-pink-500 to-purple-600 bg-clip-text text-transparent">課堂問答大賽 (同學端)</span>
                    <span class="bg-pink-100 text-pink-700 text-xs px-2.5 py-0.5 rounded-full font-black border border-pink-300">🎓 平板專用</span>
                </h1>
            </div>
        </div>

        <div id="roomBadge" class="hidden flex items-center bg-pink-50 border-2 border-pink-300 rounded-2xl px-3 py-1">
            <span class="text-xs font-black text-pink-500 mr-1.5">🔑 房間號:</span>
            <span id="roomNumDisplay" class="font-black text-purple-600 text-lg font-fredoka">----</span>
        </div>
    </header>

    <!-- 主內容區 -->
    <main class="flex-1 relative overflow-hidden flex flex-col justify-center items-center p-4 z-10">

        <!-- 登入卡片 -->
        <div id="studentSetupModal" class="w-full max-w-lg bg-white/95 backdrop-blur-md rounded-3xl p-6 shadow-xl border-4 border-pink-300 pop-card">
            <div class="text-center mb-5">
                <div class="w-16 h-16 bg-gradient-to-tr from-pink-400 to-amber-300 text-white rounded-2xl flex items-center justify-center text-3xl mx-auto mb-2 shadow-md border-2 border-white transform rotate-3">
                    🐥
                </div>
                <h3 class="text-2xl font-black text-slate-800">登入問答小組 🌟</h3>
                <p class="text-xs text-pink-600 font-bold mt-1">請輸入老師大螢幕上的 4 位數房間號碼</p>
            </div>

            <form onsubmit="event.preventDefault(); startStudentSession();" class="space-y-4">
                <div>
                    <label class="block text-slate-700 font-black text-sm mb-1">1. 房間號碼 (Room Code)</label>
                    <input type="number" id="inputRoomCode" required placeholder="例如：8821" maxlength="4" class="w-full px-4 py-2.5 text-center text-2xl font-black tracking-widest text-purple-600 bg-purple-50 border-2 border-purple-200 rounded-2xl focus:ring-4 focus:ring-purple-200 outline-none font-fredoka">
                </div>

                <div>
                    <label class="block text-slate-700 font-black text-sm mb-1">2. 選擇組別</label>
                    <select id="selectGroup" required class="w-full px-4 py-3 font-black text-slate-800 bg-amber-50 border-2 border-amber-200 rounded-2xl focus:ring-4 focus:ring-amber-200 outline-none">
                        <option value="" disabled selected>-- 請選擇你是第幾組 --</option>
                        <option value="1">🐥 第 1 組</option>
                        <option value="2">🐶 第 2 組</option>
                        <option value="3">🐱 第 3 組</option>
                        <option value="4">🐰 第 4 組</option>
                        <option value="5">🦊 第 5 組</option>
                        <option value="6">🐼 第 6 組</option>
                        <option value="7">🐨 第 7 組</option>
                        <option value="8">🦁 第 8 組</option>
                    </select>
                </div>

                <div>
                    <label class="block text-slate-700 font-black text-sm mb-1">3. 參賽隊員姓名</label>
                    <input type="text" id="inputStudentName" required placeholder="例如：小明, 小紅" class="w-full px-4 py-2.5 font-bold text-slate-800 bg-sky-50 border-2 border-sky-200 rounded-2xl focus:ring-4 focus:ring-sky-200 outline-none">
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-pink-400 to-rose-400 hover:from-pink-500 hover:to-rose-500 text-white font-black text-lg py-3 rounded-2xl shadow-md transition mt-2 pop-btn border-2 border-white">
                    準備好作答了！ 🚀
                </button>
            </form>
        </div>

        <!-- 同學答題框架 -->
        <div id="studentFrame" class="hidden w-full max-w-4xl h-full flex flex-col justify-between p-2">
            <div class="bg-white/90 rounded-2xl p-3 shadow-sm border-2 border-pink-200 flex justify-between items-center mb-3 shrink-0">
                <div class="flex items-center gap-3">
                    <span id="studentGroupBadge" class="bg-gradient-to-r from-pink-400 to-amber-400 text-white font-black px-4 py-1.5 rounded-xl text-lg shadow-sm border border-white">
                        第 - 組
                    </span>
                    <div>
                        <p class="text-[10px] text-slate-400 font-bold">隊員名單</p>
                        <p id="studentNameDisplay" class="font-black text-slate-700 text-sm md:text-base">--</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <div id="studentSyncIndicator" class="text-xs font-black text-emerald-600 flex items-center gap-1.5 bg-emerald-50 border border-emerald-200 px-3 py-1.5 rounded-xl">
                        <i class="fa-solid fa-[#bridge] fa-wifi text-emerald-500"></i>
                        <span>已通過連線橋樑連接大螢幕</span>
                    </div>
                    <button onclick="reeditStudentSetup()" class="text-slate-400 hover:text-slate-600 text-xs font-bold underline">
                        換組別
                    </button>
                </div>
            </div>

            <!-- 答案輸入區 -->
            <div class="flex-1 bg-white rounded-3xl p-5 shadow-lg border-4 border-sky-300 flex flex-col min-h-0 relative pop-card">
                <div class="flex justify-between items-center mb-2">
                    <label class="text-sky-800 font-black text-base md:text-lg flex items-center gap-2">
                        <span>✏️ 在這裏寫下你們組的答案吧：</span>
                    </label>
                    <span id="charCounter" class="text-xs font-black bg-sky-100 text-sky-700 px-2.5 py-1 rounded-full">0 字</span>
                </div>

                <textarea id="studentAnswerInput" oninput="handleStudentInput()" placeholder="在這裡輸入答案..." class="flex-1 w-full p-4 font-bold text-slate-800 text-lg md:text-xl leading-relaxed bg-amber-50/50 border-2 border-amber-200 rounded-2xl focus:bg-white focus:border-pink-400 focus:ring-4 focus:ring-pink-100 outline-none resize-none custom-scrollbar"></textarea>

                <div class="mt-3 flex justify-between items-center shrink-0">
                    <p class="text-xs font-bold text-amber-600 flex items-center gap-1">
                        💡 打字時答案會透過廣播橋樑即時發送到老師的大螢幕！
                    </p>
                    <button onclick="manualSendAnswer()" class="bg-gradient-to-r from-sky-400 to-cyan-400 hover:from-sky-500 hover:to-cyan-500 text-white font-black px-6 py-2.5 rounded-2xl shadow-md transition flex items-center gap-2 text-sm pop-btn border border-white">
                        <i class="fa-solid fa-paper-plane"></i>
                        <span>即時發送</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const state = {
            roomCode: null,
            groupNum: null,
            studentName: '',
            mqttClient: null,
            syncTimer: null
        };

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const r = urlParams.get('room');
            if (r) document.getElementById('inputRoomCode').value = r;
        });

        function startStudentSession() {
            const roomCode = document.getElementById('inputRoomCode').value.trim();
            const groupNum = document.getElementById('selectGroup').value;
            const name = document.getElementById('inputStudentName').value.trim();

            if (!roomCode || roomCode.length !== 4) {
                alert("請輸入正確的 4 位數房間號碼！");
                return;
            }
            if (!groupNum || !name) {
                alert("請完整選擇組別與輸入姓名！");
                return;
            }

            state.roomCode = roomCode;
            state.groupNum = groupNum;
            state.studentName = name;

            document.getElementById('roomNumDisplay').innerText = roomCode;
            document.getElementById('roomBadge').classList.remove('hidden');
            document.getElementById('studentSetupModal').classList.add('hidden');
            document.getElementById('studentFrame').classList.remove('hidden');
            document.getElementById('studentFrame').classList.add('flex');

            document.getElementById('studentGroupBadge').innerText = `第 ${groupNum} 組`;
            document.getElementById('studentNameDisplay').innerText = name;

            // 建立跨裝置 MQTT 連線橋樑
            connectMQTTBridge();
        }

        function connectMQTTBridge() {
            // 連接免費公共 WebSocket 橋樑
            const brokerUrl = 'wss://broker.emqx.io:8084/mqtt';
            const clientId = 'student_' + Math.random().toString(16).substr(2, 8);

            state.mqttClient = mqtt.connect(brokerUrl, { clientId: clientId, keepalive: 60 });

            state.mqttClient.on('connect', () => {
                console.log("連線橋樑連接成功！");
                sendDataThroughBridge();
            });

            state.mqttClient.on('error', (err) => {
                console.error("橋樑連線出錯:", err);
            });
        }

        function reeditStudentSetup() {
            if (confirm("是否要重設組別與姓名？")) {
                document.getElementById('studentFrame').classList.add('hidden');
                document.getElementById('studentSetupModal').classList.remove('hidden');
            }
        }

        function handleStudentInput() {
            const val = document.getElementById('studentAnswerInput').value;
            document.getElementById('charCounter').innerText = `${val.length} 字`;

            clearTimeout(state.syncTimer);
            state.syncTimer = setTimeout(() => {
                sendDataThroughBridge();
            }, 200);
        }

        function manualSendAnswer() {
            sendDataThroughBridge();
            showStatus("已發送！");
        }

        function sendDataThroughBridge() {
            if (!state.mqttClient || !state.roomCode || !state.groupNum) return;

            const answerVal = document.getElementById('studentAnswerInput').value;
            const topic = `classroom_quiz_${state.roomCode}/group_${state.groupNum}`;

            const payload = JSON.stringify({
                group: state.groupNum,
                name: state.studentName,
                answer: answerVal,
                timestamp: Date.now()
            });

            // 透過橋樑廣播
            state.mqttClient.publish(topic, payload);
            showStatus("答案已通過橋樑發送");
        }

        function showStatus(msg) {
            const el = document.getElementById('studentSyncIndicator');
            el.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-500"></i><span class="text-emerald-700">${msg}</span>`;
            setTimeout(() => {
                el.innerHTML = `<i class="fa-solid fa-wifi text-emerald-500"></i><span>已通過連線橋樑連接大螢幕</span>`;
            }, 2000);
        }
    </script>
</body>
</html>
